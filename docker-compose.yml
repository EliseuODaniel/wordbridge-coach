name: wordbridge-coach

x-llama-cuda-service: &llama-cuda-service
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  restart: unless-stopped
  volumes:
    - ./llm_models:/models
  networks:
    - wordbridge-coach-net
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  # PostgreSQL Database (Development)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: filltheword
      POSTGRES_USER: ftw_user
      POSTGRES_PASSWORD: ftw_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${WORDBRIDGE_DB_PORT:-${FTW_DB_PORT:-5432}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wordbridge-coach-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftw_user -d filltheword"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Test Database
  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: filltheword_test
      POSTGRES_USER: ftw_user
      POSTGRES_PASSWORD: ftw_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${WORDBRIDGE_TEST_DB_PORT:-${FTW_TEST_DB_PORT:-5433}}:5432"  # Different port to avoid conflict
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for test isolation
    networks:
      - wordbridge-coach-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftw_user -d filltheword_test"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["test"]  # Only start with --profile test

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        INSTALL_ARGOS: "${INSTALL_ARGOS:-false}"
    environment:
      DATABASE_URL: postgresql://ftw_user:ftw_password@db:5432/filltheword
      TTS_SERVICE_URL: http://tts:8001
      AUDIO_CACHE_PATH: /audio
      SECRET_KEY: "${SECRET_KEY:-wordbridge-local-dev-secret-not-for-production}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DEBUG: "${DEBUG:-true}"
      STRICT_CONFIG: "${STRICT_CONFIG:-false}"
      LINGVIST_TRANSLATIONS_AUTOFILL: "${LINGVIST_TRANSLATIONS_AUTOFILL:-true}"
      LINGVIST_TRANSLATIONS_PROVIDER: "${LINGVIST_TRANSLATIONS_PROVIDER:-google_http}"
      LINGVIST_TRANSLATIONS_NETWORK_ENABLED: "${LINGVIST_TRANSLATIONS_NETWORK_ENABLED:-true}"
      LINGVIST_TRANSLATIONS_TARGET_LANG: "${LINGVIST_TRANSLATIONS_TARGET_LANG:-pt}"
      # Chat Coach LLM Configuration
      CHAT_LLM_PROVIDER: "${CHAT_LLM_PROVIDER:-llamacpp}"
      CHAT_LLM_BASE_URL: "${CHAT_LLM_BASE_URL:-http://llm:8080/v1}"
      CHAT_LLM_MODEL: "${CHAT_LLM_MODEL:-gemma-4-e4b-it}"
      CHAT_LLM_STRICT: "${CHAT_LLM_STRICT:-true}"
      # Chat Coach Draft Grammar Configuration
      CHAT_DRAFT_GRAMMAR_PROVIDER: "${CHAT_DRAFT_GRAMMAR_PROVIDER:-languagetool}"
      CHAT_LANGUAGETOOL_URL: "${CHAT_LANGUAGETOOL_URL:-http://languagetool:8010}"
      CHAT_DRAFT_SUGGESTIONS_ENABLED: "${CHAT_DRAFT_SUGGESTIONS_ENABLED:-true}"
      CHAT_DRAFT_SUGGESTIONS_MAX: "${CHAT_DRAFT_SUGGESTIONS_MAX:-8}"
      CHAT_MICRO_EVAL_MIN_INTERVAL_MS: "${CHAT_MICRO_EVAL_MIN_INTERVAL_MS:-250}"
    ports:
      - "8000:8000"
    volumes:
      - audio_cache:/audio
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wordbridge-coach-net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TTS Service
  tts:
    build:
      context: ./tts
      dockerfile: Dockerfile
    environment:
      AUDIO_CACHE_PATH: /audio
      MODELS_PATH: /models
    ports:
      - "8001:8001"
    volumes:
      - audio_cache:/audio
      - tts_models:/models
      - ./tts:/app
    networks:
      - wordbridge-coach-net
    restart: unless-stopped
    profiles:
      - audio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM Service (llama.cpp with CUDA)
  llm:
    <<: *llama-cuda-service
    ports:
      - "8080:8080"  # Internal only (accessible via Docker network)
    command: >
      -m /models/model.gguf
      -c 4096
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --parallel 2
    profiles:
      - ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional fast chat profile (Phi-3 Mini 4K)
  llm_chat:
    <<: *llama-cuda-service
    ports:
      - "8081:8081"
    command: >
      -m /models/Phi-3-mini-4k-instruct-q4.gguf
      -c 4096
      --host 0.0.0.0
      --port 8081
      --n-gpu-layers 999
      --parallel 2
    profiles:
      - ai
      - fastchat
      - optional-llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional fast teacher-analysis profile (Qwen 2.5 3B)
  llm_teacher:
    <<: *llama-cuda-service
    ports:
      - "8082:8082"
    command: >
      -m /models/qwen2.5-3b-instruct-q4_k_m.gguf
      -c 2048
      --host 0.0.0.0
      --port 8082
      --n-gpu-layers 999
      --parallel 2
    profiles:
      - ai
      - optional-llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LanguageTool Service (Grammar/Spell Checking)
  languagetool:
    image: erikvl87/languagetool:latest
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - LANGUAGETOOL_PORT=8010
      - LANGUAGETOOL_LANGUAGE_TOOL__ANONYMIZED__TEXT__MIN_LENGTH=0
      - LANGUAGETOOL_LANGUAGE_TOOL__ANONYMIZED__TEXT__MIN_LENGTH__FOR__CHECKING=0
    profiles:
      - ai
    networks:
      - wordbridge-coach-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/v2/languages || exit 1"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 10

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3007:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wordbridge-coach-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  audio_cache:
    driver: local
  tts_models:
    driver: local

networks:
  wordbridge-coach-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
