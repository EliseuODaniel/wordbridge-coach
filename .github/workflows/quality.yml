name: Quality

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "chore/**"
      - "hotfix/**"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: filltheword_test
          POSTGRES_USER: ftw_user
          POSTGRES_PASSWORD: ftw_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ftw_user -d filltheword_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://ftw_user:ftw_password@localhost:5433/filltheword_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
            api/requirements-argos.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest tests/test_database_config.py -q
      - run: python -m pytest tests/test_request_user_service.py -q
      - run: python -m pytest tests/test_card_selection_mode_service.py -q
      - run: python -m pytest tests/test_vocabulary_progression.py -q
      - run: python -m pytest tests/test_lingvist_difficulty_service.py -q
      - run: python -m pytest tests/test_pedagogical_metrics_eval.py -q
      - run: python -m pytest tests/test_pedagogical_prompt_snapshots.py -q
      - run: python -m pytest tests/test_chat_profile_service.py -q
      - run: python -m pytest tests/test_chat_draft_service.py -q
      - run: python -m pytest tests/test_chat_feedback_service.py -q
      - run: python -m pytest tests/test_chat_context_service.py -q
      - run: python -m pytest tests/test_chat_delivery_service.py -q
      - run: python -m pytest tests/test_chat_text_service.py -q
      - run: python -m pytest tests/test_chat_rest_service.py -q
      - run: python -m pytest tests/test_chat_conversation_service.py -q
      - run: python -m pytest tests/test_chat_generation_service.py -q
      - run: python -m pytest tests/test_chat_draft_state_service.py -q
      - run: python -m pytest tests/test_chat_handler_service.py -q
      - run: python -m pytest tests/test_chat_endpoint_adapter_service.py -q
      - run: python -m pytest tests/test_chat_websocket_service.py -q
      - run: python -m pytest tests/test_lingvist_payload_service.py -q
      - run: python -m pytest tests/test_lingvist_autofill_service.py -q
      - run: python -m pytest tests/test_card_next_service.py -q
      - run: python -m pytest tests/test_card_answer_service.py -q
      - run: python -m pytest tests/test_card_progress_service.py -q
      - run: python -m pytest tests/test_card_response_service.py -q
      - run: python -m pytest tests/test_card_submission_service.py -q
      - run: python -m pytest tests/test_card_spec4_service.py -q
      - run: python -m pytest tests/test_card_lingvist_service.py -q
      - run: python -m pytest tests/test_card_selection_payload_service.py -q
      - run: python -m pytest tests/test_card_selection_policy_service.py -q
      - run: python -m pytest tests/test_card_selection_query_service.py -q
      - run: python -m pytest tests/test_card_selection_fallback_service.py -q
      - run: python -m pytest tests/test_card_selection_progress_service.py -q
      - run: python -m pytest tests/test_chat_runtime_service.py -q
      - run: python -m pytest tests/test_chat_turn_service.py -q
      - run: python -m pytest tests/test_chat_coach_mock_provider.py -q
      - run: python -m pytest tests/test_chat_utilities.py -q
      - run: python -m pytest tests/test_user_llm_preferences_service.py -q
      - run: python -m pytest tests/integration/test_chat_websocket_flow.py -q
      - run: python -m pytest tests/integration/test_spec4_card_selection.py -q
      - run: python -m pytest tests/integration/test_stats_settings_require_user.py -q
      - run: python -m pytest tests/integration/test_insights_word_by_card.py -q
      - run: python -m pytest tests/integration/test_insights_frequency.py -q

  e2e-chromium:
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json
      - run: docker compose up -d --build db api frontend
      - run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3007 >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          exit 1
      - run: docker compose exec -T api alembic upgrade head
      - run: docker compose exec -T api python scripts/seed_data.py
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: BASE_URL=http://127.0.0.1:3007 npm run test:ci
        working-directory: tests/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
